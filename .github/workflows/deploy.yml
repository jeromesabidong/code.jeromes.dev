name: Deploy to S3

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: "24.14.0"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          PUBLIC_GA_ID: ${{ vars.PUBLIC_GA_ID }}

      - name: Check for broken links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --include-mail --root-dir dist --remap "${{ vars.SITE_URL }} file://${{ github.workspace }}/dist" dist
          fail: true

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - run: aws s3 sync dist/ s3://${{ vars.S3_BUCKET }} --delete

      - run: aws cloudfront create-invalidation --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
