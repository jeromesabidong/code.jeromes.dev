name: Dependency Audit & Update

on:
  schedule:
    - cron: "0 9 * * 1" # every Monday at 09:00 UTC

permissions:
  contents: write
  pull-requests: write

jobs:
  audit-and-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: "24.14.0"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Security audit
        run: |
          echo "## Security audit (pnpm audit)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          pnpm audit >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Outdated dependencies
        run: |
          echo "## Outdated packages (pnpm outdated)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          pnpm outdated >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Update dependencies within declared ranges
        run: pnpm update

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: update dependencies"
          title: "chore: weekly dependency update"
          body: |
            Automated dependency update from the scheduled audit workflow.

            See the workflow run summary for the full `pnpm audit` and `pnpm outdated` reports.
          branch: chore/dependency-update
          delete-branch: true
